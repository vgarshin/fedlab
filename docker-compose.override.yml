# Dev overrides (automatic with plain `docker compose up`): code bind-mounted, API reload, Vite dev server.
services:
  api:
    environment:
      FEDLAB_ENV: dev
      FEDLAB_RUN_ID_START: "9000"
      FEDLAB_SETTINGS_PATH: /app/config/settings.json
      FEDLAB_SECRETS_PATH: /run/secrets/app_secrets
    volumes:
      - ./core:/app/core
      - ./api:/app/api
      - ./worker:/app/worker
      - ./prompts:/app/prompts
      - ./alembic:/app/alembic
      - ./docs:/app/docs
      - ./config/settings.json:/app/config/settings.json:ro
    command: ["uvicorn", "api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["127.0.0.1:8100:8000"]
  worker:
    environment:
      FEDLAB_ENV: dev
      FEDLAB_RUN_ID_START: "9000"
    volumes:
      - ./core:/app/core
      - ./api:/app/api
      - ./worker:/app/worker
      - ./prompts:/app/prompts
      - ./alembic:/app/alembic
      - ./docs:/app/docs
      - ./config/settings.json:/app/config/settings.json:ro
  web:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./web:/web
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]
